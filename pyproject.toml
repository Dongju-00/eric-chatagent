[project]
name = "eric-chatagent"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # 학습/모델
    "torch",
    "sentencepiece",
    "numpy",
    "huggingface-hub",        # 가중치/토크나이저 주입 (Dockerfile, README)
    # 데이터
    "datasets",
    "pandas",
    # RAG
    "chromadb",
    # LangChain / LangGraph
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "langchain-openai",
    "langsmith",
    # API 서버
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",                  # vLLM 라우터 호출 (graph.py)
    # 기타
    "python-dotenv",
    "google-genai",
    "trafilatura",
    "transformers>=5.14.1",
    "typing-extensions",      # TypedDict/Annotated (graph.py)
    "modal>=1.5.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
