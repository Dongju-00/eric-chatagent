[project]
name = "korean-chatbot"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # 학습/모델
    "torch",
    "sentencepiece",
    "numpy",
    # 데이터
    "datasets",
    "pandas",
    # RAG
    "chromadb",
    # LangChain / LangGraph
    "langgraph",
    "langchain-core",
    "langchain-google-genai",
    "langchain-openai",
    "langsmith",
    # API 서버
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    # 기타
    "python-dotenv",
    "google-genai",
]