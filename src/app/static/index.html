<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>채팅</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: #9bbbd4; /* 페이지 바깥 배경 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ── 채팅방 전체 프레임 ───────────────────── */
    .chat-app {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      background: #b2c7d9; /* 카톡 채팅방 특유의 블루그레이 */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
    }

    @media (min-width: 480px) {
      .chat-app {
        border-radius: 12px;
        overflow: hidden;
      }
    }

    /* ── 상단 헤더 ───────────────────────────── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: #a9c0d5;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }

    .chat-header .room-name {
      font-size: 16px;
      font-weight: 700;
      color: #1f2b38;
    }

    .chat-header .room-count {
      font-size: 14px;
      color: #5b6b7a;
    }

    /* ── 메시지 영역 ─────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .date-divider {
      align-self: center;
      margin: 8px 0 12px;
      padding: 5px 14px;
      font-size: 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 999px;
    }

    /* 메시지 한 줄(프로필 + 말풍선 + 시간) */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      max-width: 100%;
    }

    .msg-row.me {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.bot {
      align-self: flex-start;
    }

    /* 상대방 프로필 */
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background: #7a94ab;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: flex-start;
    }

    .msg-body {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    .sender-name {
      font-size: 12px;
      color: #43586b;
      margin: 0 0 4px 4px;
    }

    /* 말풍선 */
    .bubble {
      padding: 8px 12px;
      font-size: 14.5px;
      line-height: 1.45;
      border-radius: 14px;
      word-break: break-word;
      white-space: pre-wrap;
      width: fit-content;
    }

    .msg-row.bot .bubble {
      background: #ffffff;
      color: #222;
      border-top-left-radius: 3px;
    }

    .msg-row.me .bubble {
      background: #fee500; /* 카톡 노란 말풍선 */
      color: #1f1f1f;
      border-top-right-radius: 3px;
      align-self: flex-end;
    }

    .msg-time {
      font-size: 11px;
      color: #5b6b7a;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    /* 연속 메시지 간격 살짝 넓히기 */
    .msg-row + .msg-row {
      margin-top: 6px;
    }

    /* "입력 중..." 표시 */
    .typing .bubble {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
    }

    .typing .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #b6bcc4;
      animation: blink 1.2s infinite;
    }

    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.3; }
      30% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing .dot { animation: none; opacity: 0.6; }
    }

    /* ── 하단 입력창 ─────────────────────────── */
    .chat-input {
      display: flex;
      align-items: flex-end;
      background: #ffffff;
      padding: 10px;
      gap: 8px;
      flex-shrink: 0;
    }

    .chat-input textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.4;
      max-height: 96px;
      padding: 8px 4px;
    }

    .chat-input button {
      border: none;
      background: #fee500;
      color: #3c1e1e;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .chat-input button:hover:not(:disabled) {
      background: #f6d800;
    }

    .chat-input button:disabled {
      background: #eee;
      color: #aaa;
      cursor: default;
    }

    .chat-input button:focus-visible,
    .chat-input textarea:focus-visible {
      outline: 2px solid #4a90d9;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <span class="room-name">챗봇</span>
      <span class="room-count">2</span>
    </header>

    <main class="chat-messages" id="messages" aria-live="polite"></main>

    <footer class="chat-input">
      <textarea
        id="input"
        rows="1"
        placeholder="메시지 입력"
        aria-label="메시지 입력"
      ></textarea>
      <button id="sendBtn" type="button">전송</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
